[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-lab"
version = "0.0.1"
description = "Personal learning lab for AI/ML and computational biology"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["01-python-foundation/tests"]
pythonpath = ["01-python-foundation"]