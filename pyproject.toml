[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-lab"
version = "0.0.1"
description = "Personal learning lab for AI/ML and computational biology"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["01-python-foundation/tests", "03-supervised-foundations/tests"]
pythonpath = ["01-python-foundation", "03-supervised-foundations"]